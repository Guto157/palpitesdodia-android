name: Build AAB
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install and Sync
        run: |
          ls -la
          find . -type f -name "gradlew" | head
          if [ -f package.json ]; then
            npm install
          else
            npm init -y
            npm install @capacitor/android @capacitor/core
          fi
          npx cap sync android || echo "sync falhou, continuando"
          echo "--- onde está o gradlew ---"
          find . -name "gradlew"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build AAB
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          echo "Achou em $GRADLEW_PATH"
          ANDROID_DIR=$(dirname "$GRADLEW_PATH")
          cd "$ANDROID_DIR"
          chmod +x gradlew
          ./gradlew bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: "**/outputs/bundle/release/*.aab"

name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ERRO 1 - android.zip quebrado
      - name: 1. Apagar android velho
        run: rm -rf android

      # ERRO 2 - faltava o executavel do cap
      - name: 2. Instalar tudo que falta
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/cli @capacitor/core @capacitor/android --save --legacy-peer-deps

      - name: 3. Criar www e config
        run: |
          mkdir -p www
          echo '<!DOCTYPE html><html><body><h1>Palpites</h1></body></html>' > www/index.html
          echo '{"appId":"com.palpitesdodia.app","appName":"Palpites do Dia","webDir":"www"}' > capacitor.config.json

      - name: 4. Criar projeto android
        run: npx --yes @capacitor/cli add android

      # ERRO 3 - seu print: capacitor.settings.gradle does not exist
      - name: 5. Correcao definitiva do settings.gradle
        run: |
          cat > android/capacitor.settings.gradle <<'EOF'
          include ':capacitor-android'
          project(':capacitor-android').projectDir = new File('../node_modules/@capacitor/android')
          include ':capacitor-cordova-android-plugins'
          project(':capacitor-cordova-android-plugins').projectDir = new File('./capacitor-cordova-android-plugins/')
          EOF

          cat > android/settings.gradle <<'EOF'
          include ':app'
          apply from: "capacitor.settings.gradle"
          EOF

          mkdir -p android/capacitor-cordova-android-plugins/src/main/java
          echo "android { namespace 'capacitor.cordova.android.plugins' }" > android/capacitor-cordova-android-plugins/build.gradle
          echo "" > android/capacitor-cordova-android-plugins/settings.gradle

      - name: 6. Copiar e Buildar AAB
        run: |
          npx --yes @capacitor/cli copy android
          cd android
          chmod +x gradlew
          ./gradlew bundleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-aab
          path: android/app/build/outputs/bundle/debug/*.aab

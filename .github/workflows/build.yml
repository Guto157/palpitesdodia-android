name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 1. Instala as dependências necessárias do Capacitor
      - run: npm install @capacitor/cli @capacitor/core @capacitor/android --save --legacy-peer-deps

      # 2. Configura a estrutura web e o arquivo de configuração do projeto
      - run: |
          mkdir -p www
          echo '<h1>Palpites do Dia</h1>' > www/index.html
          echo '{"appId":"com.palpitesdodia.app","appName":"Palpites do Dia","webDir":"www"}' > capacitor.config.json

      # 3. Reconstrói a plataforma /android nativa do zero
      - run: |
          rm -rf android
          npx cap add android

      # 4. Sincroniza os arquivos web para dentro do projeto nativo
      - run: npx cap sync android

      # 5. ATUALIZAÇÃO DE VARIÁVEIS NATIVAS: Min SDK 24 e incremento automático de versões
      - run: |
          sed -i 's/minSdkVersion = 23/minSdkVersion = 24/g' android/variables.gradle
          sed -i 's/versionCode = 1/versionCode = 2/g' android/variables.gradle
          sed -i 's/versionName = "1.0"/versionName = "1.0.1"/g' android/variables.gradle

      # 6. ALINHAMENTO DO KOTLIN: Previne o erro CheckDuplicatesRunnable
      - run: |
          echo "subprojects {
              configurations.all {
                  resolutionStrategy {
                      eachDependency { details ->
                          if (details.requested.group == 'org.jetbrains.kotlin') {
                              details.useVersion '1.8.22'
                          }
                      }
                  }
              }
          }" >> android/build.gradle

      # 7. EXTRAÇÃO CORRETA DA CHAVE: Remove espaços em branco ou quebras de linha antes de decodificar
      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | tr -d '\r\n ' | base64 --decode > android/app/palpites_real.keystore

      # 8. ASSINATURA DE PRODUÇÃO: Configura o Gradle para aplicar sua assinatura oficial no modo Release
      - run: |
          echo "
          android {
              signingConfigs {
                  release {
                      storeFile file('palpites_real.keystore')
                      storePassword '${{ secrets.ANDROID_KEYSTORE_PASSWORD }}'
                      keyAlias '${{ secrets.ANDROID_KEY_ALIAS }}'
                      keyPassword '${{ secrets.ANDROID_KEY_PASSWORD }}'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }" >> android/app/build.gradle

      # 9. COMPILAÇÃO OFICIAL: Gera o arquivo final otimizado em modo Release
      - run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      # 10. PUBLICAÇÃO DO ARTIFACT: Disponibiliza o arquivo .aab assinado e pronto para a Play Store
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

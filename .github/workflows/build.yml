name: Build AAB
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: |
          ls -la
          unzip -o android.zip
          rm android.zip || true
          ls -la
          find . -type f -name "gradlew" | head -20
          npm install
          mkdir -p www && echo "ok" > www/index.html || true
          npx cap sync android || true
          GW=$(find . -type f -name "gradlew" | head -n 1)
          echo "Gradlew em: $GW"
          cd $(dirname $GW)
          chmod +x gradlew
          ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: aab-final
          path: "**/outputs/bundle/release/*.aab"

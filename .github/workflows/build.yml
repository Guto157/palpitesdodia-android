name: Build AAB
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Limpar android antigo
        run: rm -rf android

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Instalar Capacitor
        run: npm install @capacitor/cli @capacitor/core @capacitor/android --save --legacy-peer-deps

      - name: Criar arquivos que faltam
        run: |
          mkdir -p www
          if [ ! -f www/index.html ]; then echo '<!DOCTYPE html><html><body><h1>Palpites</h1></body></html>' > www/index.html; fi
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            echo '{"appId":"com.palpitesdodia.app","appName":"Palpites do Dia","webDir":"www","bundledWebRuntime":false}' > capacitor.config.json
          fi
          ls -la
          cat capacitor.config.json || cat capacitor.config.ts

      - name: Criar projeto Android
        run: npx --yes @capacitor/cli add android

      - name: Copiar web para android
        run: npx --yes @capacitor/cli copy android

      - name: Gerar AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-aab
          path: android/app/build/outputs/bundle/debug/*.aab

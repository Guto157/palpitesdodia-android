name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17 # Versão recomendada e estável para builds do ecossistema Android/Capacitor

      # 1. Instala o CLI do Capacitor e as dependências necessárias
      - run: npm install @capacitor/cli @capacitor/core @capacitor/android --save --legacy-peer-deps

      # 2. Configura o appId (com.palpitesdodia.app) e o appName (Palpites do Dia)
      # Além de garantir que a pasta /www exista com uma estrutura mínima de inicialização
      - run: |
          mkdir -p www
          echo '<h1>Palpites do Dia</h1>' > www/index.html
          echo '{"appId":"com.palpitesdodia.app","appName":"Palpites do Dia","webDir":"www"}' > capacitor.config.json

      # 3. Remove qualquer resquício anterior e cria a plataforma /android de forma limpa
      - run: |
          rm -rf android
          npx cap add android

      # 4. Sincroniza a pasta /www e injeta as dependências corretas para o Gradle (Evita o erro da linha 10)
      - run: npx cap sync android

      # 5. Entra na pasta /android, concede permissão ao Gradle e gera o bundleDebug
      - run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleDebug

      # 6. Salva o arquivo .aab gerado nos Artifacts para download
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-aab
          path: android/app/build/outputs/bundle/debug/app-debug.aab

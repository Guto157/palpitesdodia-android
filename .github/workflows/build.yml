name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 1. Instala as dependências do Capacitor
      - run: npm install @capacitor/cli @capacitor/core @capacitor/android --save --legacy-peer-deps

      # 2. Configura a estrutura web e o ID do seu aplicativo
      - run: |
          mkdir -p www
          echo '<h1>Palpites do Dia</h1>' > www/index.html
          echo '{"appId":"com.palpitesdodia.app","appName":"Palpites do Dia","webDir":"www"}' > capacitor.config.json

      # 3. Cria a pasta android nativa
      - run: |
          rm -rf android
          npx cap add android

      # 4. Sincroniza os arquivos
      - run: npx cap sync android

      # 5. RECONSTRUTOR BINÁRIO: Converte o texto Base64 do seu celular de volta para a Keystore real
      - name: Decode Keystore File
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/palpites_real.keystore

      # 6. DETECTOR DE ALIAS: Lê a chave e mostra o nome do Alias na tela de logs do GitHub
      - name: Revelar Meu Key Alias Real
        run: |
          echo "=== PROCURANDO SEU ALIAS ABAIXO ==="
          keytool -list -v -keystore android/app/palpites_real.keystore -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" | grep -i "Nome do alias" || keytool -list -v -keystore android/app/palpites_real.keystore -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" | grep -i "Alias name"
          echo "==================================="

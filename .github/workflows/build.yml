name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: rm -rf android
      - run: npm install --legacy-peer-deps
      - run: npm install @capacitor/cli @capacitor/core @capacitor/android --save --legacy-peer-deps
      - run: |
          mkdir -p www
          echo '<!DOCTYPE html><html><body><h1>Palpites</h1></body></html>' > www/index.html
          echo '{"appId":"com.palpitesdodia.app","appName":"Palpites do Dia","webDir":"www"}' > capacitor.config.json
      - run: npx --yes @capacitor/cli add android
      - run: npx --yes @capacitor/cli copy android
      - run: |
          rm -rf android/capacitor-cordova-android-plugins
          echo "include ':capacitor-android'" > android/capacitor.settings.gradle
          echo "project(':capacitor-android').projectDir = new File('../node_modules/@capacitor/android')" >> android/capacitor.settings.gradle
          echo "include ':app'" > android/settings.gradle
          echo 'apply from: "capacitor.settings.gradle"' >> android/settings.gradle
      - run: cd android && chmod +x gradlew && ./gradlew bundleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-aab
          path: android/app/build/outputs/bundle/debug/*.aab

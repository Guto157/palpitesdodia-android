name: Build Android AAB
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Decode Keystore
        run: |
          mkdir -p android/app
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
          ls -lh android/app/release.keystore

      - name: Find and Build
        run: |
          echo "Procurando gradlew..."
          find . -name "gradlew" -type f
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -1)
          if [ -z "$GRADLEW_PATH" ]; then echo "ERRO: gradlew não encontrado no repositório"; ls -R | head -100; exit 1; fi
          echo "Achou em: $GRADLEW_PATH"
          chmod +x $GRADLEW_PATH
          DIR=$(dirname $GRADLEW_PATH)
          cd $DIR
          ./gradlew bundleRelease -Pandroid.injected.signing.store.file=app/release.keystore -Pandroid.injected.signing.store.password=${{ secrets.STORE_PASSWORD }} -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: app-aab
          path: |
            **/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/bundle/release/*.aab

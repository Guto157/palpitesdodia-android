name: Build AAB
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: |
          DIR=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1 | xargs dirname)
          echo "Projeto em: $DIR"
          cd $DIR
          npm install
          npx cap sync android || npx cap sync
          cd ..
          GRADLEW=$(find . -name "gradlew" | head -n 1)
          echo "Gradlew em: $GRADLEW"
          cd $(dirname $GRADLEW)
          chmod +x gradlew
          ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: aab-pronto
          path: "**/outputs/bundle/release/*.aab"

name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 1. Instala as dependências do Capacitor
      - run: npm install @capacitor/cli @capacitor/core @capacitor/android --save --legacy-peer-deps

      # 2. Configura a estrutura web e o ID do seu aplicativo
      - run: |
          mkdir -p www
          echo '<h1>Palpites do Dia</h1>' > www/index.html
          echo '{"appId":"com.palpitesdodia.app","appName":"Palpites do Dia","webDir":"www"}' > capacitor.config.json

      # 3. Cria a pasta android APENAS se ela não existir (Preserva a sua chave enviada pelo celular)
      - run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      # 4. Sincroniza os arquivos web mais recentes para dentro do projeto nativo
      - run: npx cap sync android

      # 5. ATUALIZAÇÃO DE VARIÁVEIS NATIVAS: Ajusta o Min SDK para 24 e atualiza as versões
      - run: |
          sed -i 's/minSdkVersion = 23/minSdkVersion = 24/g' android/variables.gradle
          sed -i 's/versionCode = 1/versionCode = 2/g' android/variables.gradle
          sed -i 's/versionName = "1.0"/versionName = "1.0.1"/g' android/variables.gradle

      # 6. ALINHAMENTO DO KOTLIN: Remove erros de classes duplicadas
      - run: |
          echo "subprojects {
              configurations.all {
                  resolutionStrategy {
                      eachDependency { details ->
                          if (details.requested.group == 'org.jetbrains.kotlin') {
                              details.useVersion '1.8.22'
                          }
                      }
                  }
              }
          }" >> android/build.gradle

      # 7. CONFIGURAÇÃO DE ASSINATURA: Vincula as senhas dos seus Secrets do GitHub à chave palpites_real.keystore
      - run: |
          echo "
          android {
              signingConfigs {
                  release {
                      storeFile file('palpites_real.keystore')
                      storePassword '${{ secrets.ANDROID_KEYSTORE_PASSWORD }}'
                      keyAlias '${{ secrets.ANDROID_KEY_ALIAS }}'
                      keyPassword '${{ secrets.ANDROID_KEY_PASSWORD }}'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }" >> android/app/build.gradle

      # 8. COMPILAÇÃO DE PRODUÇÃO: Gera o pacote oficial assinado
      - run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      # 9. SALVAR ARQUIVO: Disponibiliza o app-release.aab pronto na aba de Artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

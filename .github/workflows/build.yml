name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 1. Instala as dependências do Capacitor
      - run: npm install @capacitor/cli @capacitor/core @capacitor/android --save --legacy-peer-deps

      # 2. Configura a estrutura web e o ID do seu aplicativo
      - run: |
          mkdir -p www
          echo '<h1>Palpites do Dia</h1>' > www/index.html
          echo '{"appId":"com.palpitesdodia.app","appName":"Palpites do Dia","webDir":"www"}' > capacitor.config.json

      # 3. Cria a pasta android nativa limpa
      - run: |
          rm -rf android
          npx cap add android

      # 4. Sincroniza os arquivos mais recentes
      - run: npx cap sync android

      # 5. RECONSTRUTOR AUTOMÁTICO: Recria a sua Keystore limpando os espaços do celular
      - name: Decode Keystore File
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | tr -d '\r\n ' | base64 --decode > android/app/palpites_real.keystore

      # 6. ATUALIZAÇÃO DE VARIÁVEIS NATIVAS: Ajusta o Min SDK para 24 e atualiza as versões
      - run: |
          sed -i 's/minSdkVersion = 23/minSdkVersion = 24/g' android/variables.gradle
          sed -i 's/versionCode = 1/versionCode = 2/g' android/variables.gradle
          sed -i 's/versionName = "1.0"/versionName = "1.0.1"/g' android/variables.gradle

      # 7. ALINHAMENTO DO KOTLIN: Remove erros de classes duplicadas
      - run: |
          echo "subprojects {
              configurations.all {
                  resolutionStrategy {
                      eachDependency { details ->
                          if (details.requested.group == 'org.jetbrains.kotlin') {
                              details.useVersion '1.8.22'
                          }
                      }
                  }
              }
          }" >> android/build.gradle

      # 8. SISTEMA DE CORREÇÃO AUTOMÁTICA DE SENHA E ALIAS
      - name: Configurar Assinatura Forçada
        run: |
          # Descobre o alias real de dentro da sua chave dinamicamente
          REAL_ALIAS=$(keytool -list -keystore android/app/palpites_real.keystore -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" 2>/dev/null | grep -i 'Entry' | awk -F, '{print $1}' | tr -d ' ')
          if [ -z "$REAL_ALIAS" ]; then
            REAL_ALIAS=$(keytool -list -keystore android/app/palpites_real.keystore -storepass "Palpites123!" 2>/dev/null | grep -i 'Entry' | awk -F, '{print $1}' | tr -d ' ')
          fi
          if [ -z "$REAL_ALIAS" ]; then
            REAL_ALIAS="palpites_alias"
          fi
          
          # Injeta a configuração direto no Gradle usando o Alias descoberto
          echo "
          android {
              signingConfigs {
                  release {
                      storeFile file('palpites_real.keystore')
                      storePassword '${{ secrets.ANDROID_KEYSTORE_PASSWORD }}'
                      keyAlias '$REAL_ALIAS'
                      keyPassword '${{ secrets.ANDROID_KEY_PASSWORD }}'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }" >> android/app/build.gradle

      # 9. COMPILAÇÃO DE PRODUÇÃO: Gera o pacote oficial assinado
      - run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --continue || ./gradlew bundleRelease -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" -Pandroid.injected.signing.key.alias="palpites_alias" -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"

      # 10. SALVAR ARQUIVO: Disponibiliza o app-release.aab pronto na aba de Artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
